name = "orum-zamin-behsazan"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

# پس از ساخت KV namespace در داشبورد کلودفلر، مقدار id را اینجا جایگزین کنید.
# دستور ساخت از طریق ترمینال:  npx wrangler kv namespace create OZ_KV
[[kv_namespaces]]
binding = "OZ_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
